name: Gerar páginas de editais

# Regenera as páginas indexáveis (editais, perfis, áreas, prazos, guias, glossário, feed, sitemap)
# e as imagens de prévia quando os dados mudam e todo dia de manhã, para a situação
# "aberto/encerrado" e a ordem das listas acompanharem a data. Depois avisa os buscadores (IndexNow).
on:
  push:
    branches: [main]
    paths:
      - 'editais.json'
      - 'data/transferegov.json'
      - 'index.html'
      - 'scripts/**'
      - 'data/site.json'
      - 'assets/paginas.css'
  schedule:
    - cron: '17 9 * * *' # 06h17 em Brasília
  workflow_dispatch:
    inputs:
      notificar_tudo:
        description: 'Avisar os buscadores (IndexNow) sobre todas as páginas — use no lançamento ou após mudar de domínio'
        type: boolean
        default: false

# Permissão mínima por padrão; só o job "gerar" pode escrever no repositório.
permissions:
  contents: read

concurrency:
  group: gerar-paginas
  cancel-in-progress: false

jobs:
  # Imagens de prévia: instala pacotes do npm (Playwright), por isso roda isolado, SEM credencial de escrita.
  # Entrega só as imagens como artefato; o job "gerar" aceita apenas .jpg de assets/og e o manifesto.
  imagens:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      geradas: ${{ steps.img.outputs.geradas }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Imagens de prévia (só quando algum edital mudou)
        id: img
        run: |
          if node scripts/gerar-imagens.mjs --verificar; then
            echo "Imagens em dia."
            echo "geradas=nao" >> "$GITHUB_OUTPUT"
          else
            npm install --no-save --no-package-lock playwright@1.49.1 > /dev/null
            npx playwright install --with-deps chromium > /dev/null
            node scripts/gerar-imagens.mjs
            echo "geradas=sim" >> "$GITHUB_OUTPUT"
          fi

      - name: Guardar imagens
        if: steps.img.outputs.geradas == 'sim'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: imagens-og
          path: |
            assets/og/*.jpg
            data/og-manifest.json
          retention-days: 1

  gerar:
    needs: imagens
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Receber imagens
        if: needs.imagens.outputs.geradas == 'sim'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: imagens-og
          path: /tmp/imagens-og

      - name: Aplicar imagens (só .jpg e o manifesto)
        if: needs.imagens.outputs.geradas == 'sim'
        run: |
          set -e
          mkdir -p assets/og
          find /tmp/imagens-og -type f | while read -r f; do
            rel="${f#/tmp/imagens-og/}"
            case "$rel" in
              assets/og/*.jpg) [ "$(head -c 3 "$f" | od -An -tx1 | tr -d ' \n')" = "ffd8ff" ] && cp "$f" "$rel" || echo "Ignorado (não é JPEG): $rel" ;;
              data/og-manifest.json) node -e "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'))" "$f" && cp "$f" "$rel" ;;
              *) echo "Ignorado (fora do permitido): $rel" ;;
            esac
          done

      - name: Gerar páginas
        env:
          PIX_CHAVE: ${{ vars.PIX_CHAVE }}
        run: node scripts/gerar-paginas.mjs

      - name: Conferir o Pix da página Apoie
        env:
          PIX_CHAVE: ${{ vars.PIX_CHAVE }}
        run: node scripts/verificar-pix.mjs

      - name: Publicar alterações
        id: publicar
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nada mudou."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Atualiza páginas de editais ($(date -u +%Y-%m-%d))"
          git push
          echo "alterados<<FIM" >> "$GITHUB_OUTPUT"
          git diff --name-only HEAD~1 HEAD >> "$GITHUB_OUTPUT"
          echo "FIM" >> "$GITHUB_OUTPUT"

      - name: Avisar buscadores (IndexNow)
        if: steps.publicar.outputs.alterados != ''
        continue-on-error: true
        env:
          ALTERADOS: ${{ steps.publicar.outputs.alterados }}
        run: node scripts/notificar-buscadores.mjs $ALTERADOS

      - name: Avisar buscadores sobre todas as páginas
        if: inputs.notificar_tudo
        run: node scripts/notificar-buscadores.mjs $(git ls-files '*.html')
