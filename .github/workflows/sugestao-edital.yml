name: Sugestão de edital

# Quando alguém envia um edital pelo formulário (issue com o rótulo sugestao-edital),
# a IA extrai os dados do link e abre um pull request para revisão. Quem sugeriu é avisado na issue.
# Para evitar custo de API por abuso: roda sozinho quando o AUTOR tem permissão de escrita no repositório;
# sugestões de outras pessoas rodam quando alguém com permissão de escrita aplica o rótulo "sugestao-aprovada".
# A aprovação vale para o texto do momento do rótulo: se a issue for editada depois, nada roda
# (revise e aplique o rótulo de novo). Ver .github/scripts/autorizar-sugestao.mjs.
#
# Separação de privilégios: "autorizar" só lê; "analisar" lê a página sugerida e chama a IA sem
# credencial de escrita; "publicar" (com escrita) aplica o resultado validado e abre o PR.
on:
  issues:
    types: [opened, labeled]

permissions:
  contents: read

concurrency:
  group: sugestao-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  autorizar:
    if: >-
      github.event.issue.state == 'open' && (
        (github.event.action == 'opened' && contains(github.event.issue.labels.*.name, 'sugestao-edital') &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)) ||
        (github.event.action == 'labeled' && github.event.label.name == 'sugestao-aprovada'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    outputs:
      ok: ${{ steps.auth.outputs.ok }}
      url: ${{ steps.auth.outputs.url }}
      motivo: ${{ steps.auth.outputs.motivo }}
      avisar: ${{ steps.auth.outputs.avisar }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Conferir permissão de quem pediu e se a issue mudou depois do rótulo
        id: auth
        # O texto da issue é de terceiros: é lido pelo Node a partir do arquivo do evento, nunca interpolado no shell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/autorizar-sugestao.mjs

  recusar:
    needs: autorizar
    if: needs.autorizar.outputs.ok != '1' && needs.autorizar.outputs.avisar == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      NUM: ${{ github.event.issue.number }}
      MOTIVO: ${{ needs.autorizar.outputs.motivo }}
    steps:
      - name: Explicar por que a análise não rodou
        run: |
          printf 'A análise automática não rodou: %s.\n' "$MOTIVO" > /tmp/resposta.md
          gh issue comment "$NUM" --body-file /tmp/resposta.md

  analisar:
    needs: autorizar
    if: needs.autorizar.outputs.ok == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      candidatos: ${{ steps.monitor.outputs.candidatos }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Analisar com IA
        id: monitor
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODELO: ${{ vars.MODELO }}
          SUGESTAO_URL: ${{ needs.autorizar.outputs.url }}
          MAX_CHAMADAS_API: '3'
        run: node scripts/monitorar-fontes.mjs --url

      - name: Guardar resultado
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sugestao-resultado
          path: |
            relatorio-monitor.md
            data/novos-editais.json
          if-no-files-found: error
          retention-days: 3

  publicar:
    needs: analisar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write       # branch com o candidato
      pull-requests: write  # abrir o PR de revisão
      issues: write         # responder na issue
    env:
      GH_TOKEN: ${{ github.token }}
      NUM: ${{ github.event.issue.number }}
      CANDIDATOS: ${{ needs.analisar.outputs.candidatos }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Receber resultado
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sugestao-resultado
          path: /tmp/sugestao

      - name: Aplicar resultado (só os arquivos esperados, JSON validado)
        run: |
          set -e
          [[ "$CANDIDATOS" =~ ^[0-9]+$ ]] || { echo "Saída inesperada da análise: candidatos='$CANDIDATOS'"; exit 1; }
          node -e '
            const fs = require("fs");
            const novos = "/tmp/sugestao/data/novos-editais.json";
            if (fs.existsSync(novos)) {
              const lista = JSON.parse(fs.readFileSync(novos, "utf8"));
              if (!Array.isArray(lista) || lista.length > 1 || lista.some(x => !x || typeof x !== "object" || Array.isArray(x))) throw new Error("novos-editais inválido");
              fs.copyFileSync(novos, "data/novos-editais.json");
            }
            fs.writeFileSync("relatorio-monitor.md", fs.readFileSync("/tmp/sugestao/relatorio-monitor.md", "utf8").slice(0, 60000));
          '

      - name: Abrir pull request
        if: env.CANDIDATOS != '0'
        run: |
          RAMO="sugestao/issue-$NUM"
          cp relatorio-monitor.md /tmp/relatorio.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$RAMO"
          node scripts/monitorar-fontes.mjs --aplicar
          git add editais.json
          git commit -m "Edital sugerido na issue #$NUM"
          git push -f -u origin "$RAMO"
          printf '\n\n---\n⚠️ Conteúdo sugerido por terceiros: confira tudo no documento oficial antes do merge.\n\nCloses #%s\n' "$NUM" >> /tmp/relatorio.md
          PR=$(gh pr list --head "$RAMO" --json url --jq '.[0].url')
          if [ -z "$PR" ]; then
            PR=$(gh pr create --base main --head "$RAMO" --title "Edital sugerido (issue #$NUM)" --body-file /tmp/relatorio.md) || PR=""
          fi
          if [ -n "$PR" ]; then
            gh issue comment "$NUM" --body "Obrigado! Os dados foram extraídos e estão em revisão: $PR. Quando for aprovado, o edital aparece no site e esta issue é fechada automaticamente."
          else
            gh issue comment "$NUM" --body-file /tmp/relatorio.md
          fi

      - name: Responder quando não houver candidato
        if: env.CANDIDATOS == '0'
        run: |
          {
            echo "Obrigado pela sugestão! Veja o resultado da análise automática:"
            echo
            cat relatorio-monitor.md
            echo
            echo "Se algo estiver errado, edite a issue com o link correto da chamada oficial; a mantenedora revisa e aplica o rótulo sugestao-aprovada para analisar de novo."
          } > /tmp/resposta.md
          gh issue comment "$NUM" --body-file /tmp/resposta.md
