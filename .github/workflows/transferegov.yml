name: Programas do Transferegov

# Todo dia, lê na API pública do Transferegov os programas federais com recebimento de
# propostas voluntárias aberto ou previsto (municípios, estados, consórcios e OSCs)
# e atualiza data/transferegov.json. As páginas são regeneradas pelo workflow
# "Gerar páginas de editais" em seguida (o push dispara o gerador).
on:
  schedule:
    - cron: '23 9 * * *' # 06h23 em Brasília
  workflow_dispatch:
    inputs:
      diagnostico:
        description: 'Só mostrar contagens e amostras (não altera nada)'
        type: boolean
        default: false

# Permissão mínima por padrão; só o job que publica pode escrever.
permissions:
  contents: read

concurrency:
  group: transferegov
  cancel-in-progress: false

jobs:
  diagnostico:
    if: ${{ inputs.diagnostico }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Diagnóstico
        run: node scripts/transferegov.mjs --diagnostico

  atualizar:
    if: ${{ !inputs.diagnostico }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # commit de data/transferegov.json e das páginas regeneradas
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Testes do normalizador
        run: node --test scripts/testes/transferegov.test.mjs
      - name: Atualizar programas
        run: node scripts/transferegov.mjs
      - name: Regenerar páginas
        env:
          PIX_CHAVE: ${{ vars.PIX_CHAVE || secrets.PIX_CHAVE }}
        run: node scripts/gerar-paginas.mjs && node scripts/verificar-pix.mjs
      - name: Publicar
        id: publicar
        env:
          PIX_CHAVE: ${{ vars.PIX_CHAVE || secrets.PIX_CHAVE }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then echo "Sem mudanças."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Transferegov: programas abertos ($(date -u +%Y-%m-%d))"
          git pull --rebase -q -X theirs || { git rebase --abort; node scripts/gerar-paginas.mjs; git add -A; git commit -m "Transferegov: programas abertos"; }
          git push
          echo "alterados<<FIM" >> "$GITHUB_OUTPUT"; git diff --name-only HEAD~1 HEAD >> "$GITHUB_OUTPUT"; echo "FIM" >> "$GITHUB_OUTPUT"
      - name: Avisar buscadores (IndexNow)
        if: steps.publicar.outputs.alterados != ''
        continue-on-error: true
        env:
          ALTERADOS: ${{ steps.publicar.outputs.alterados }}
        run: echo "$ALTERADOS" | xargs node scripts/notificar-buscadores.mjs
