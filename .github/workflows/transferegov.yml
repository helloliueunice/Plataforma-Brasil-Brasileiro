name: Programas do Transferegov

# Todo dia, lê na API pública do Transferegov os programas federais com recebimento de
# propostas voluntárias aberto ou previsto (municípios, estados, consórcios e OSCs)
# e atualiza data/transferegov.json. As páginas são regeneradas pelo workflow
# "Gerar páginas de editais" em seguida (o push dispara o gerador).
on:
  schedule:
    - cron: '23 9 * * *' # 06h23 em Brasília
  workflow_dispatch:
    inputs:
      diagnostico:
        description: 'Só mostrar contagens e amostras (não altera nada)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: transferegov
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Diagnóstico
        if: inputs.diagnostico
        run: node scripts/transferegov.mjs --diagnostico
      - name: Atualizar programas
        if: ${{ !inputs.diagnostico }}
        run: node scripts/transferegov.mjs
      - name: Publicar
        if: ${{ !inputs.diagnostico }}
        run: |
          if [ -z "$(git status --porcelain data/transferegov.json)" ]; then echo "Sem mudanças."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/transferegov.json
          git commit -m "Transferegov: programas abertos ($(date -u +%Y-%m-%d))"
          git pull --rebase -q && git push
