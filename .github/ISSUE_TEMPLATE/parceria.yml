name: Parceria ou patrocínio
description: Divulgação de editais, destaque patrocinado, patrocínio de conteúdo ou plataforma para sua instituição.
title: "Parceria: "
labels: ["parceria"]
body:
  - type: markdown
    attributes:
      value: |
        **Atenção: esta solicitação fica pública.** Não informe telefone, CPF, endereço ou e-mail pessoal aqui. Indique só o nome da instituição e um canal institucional; responderemos para combinar um contato privado.
  - type: input
    id: instituicao
    attributes:
      label: Instituição ou empresa
    validations:
      required: true
  - type: dropdown
    id: interesse
    attributes:
      label: Interesse
      multiple: true
      options: [Destaque patrocinado de edital, Patrocínio de guia ou boletim, Plataforma para governo/FAP/fundação, Apoio institucional, Outro]
    validations:
      required: true
  - type: input
    id: contato
    attributes:
      label: Como prefere ser contatado
      description: Este campo é público. Use só um canal institucional (site ou e-mail genérico da instituição).
  - type: textarea
    id: detalhes
    attributes:
      label: Conte mais
